name: freetoken-desktop
base: core24
version: '0.2.0-beta.26'
title: FreeToken Desktop
icon: snap/gui/freetoken-desktop.png
summary: Manage local language models with FreeToken Desktop
description: |
  FreeToken Desktop manages local language models, engine installation,
  model downloads and an OpenAI-compatible inference server from a
  native desktop application.

  Open FreeToken Desktop and use Install to download its Python engine
  and CUDA dependencies. Models and the engine are stored under
  ~/snap/freetoken-desktop/common and require several gigabytes of disk
  space. Local inference requires a supported NVIDIA GPU and driver.

  The desktop can also share the freetoken snap's engine and models
  instead of downloading a separate engine.

  This snap uses the official Linux desktop package. Desktop updates
  are delivered through the Snap Store.
grade: stable
confinement: strict
website: https://www.flashml.ai/
source-code: https://github.com/sidalit/freetoken-desktop-snap
issues:
  - https://github.com/FlashML-org/FreeToken/issues
  - https://github.com/sidalit/freetoken-desktop-snap/issues
contact: https://github.com/sidalit/freetoken-desktop-snap/issues

platforms:
  amd64:

plugs:
  server:
    interface: content
    content: freetoken-server-v1
    target: $SNAP_COMMON/server
  models:
    interface: content
    content: freetoken-models-v1
    target: $SNAP_COMMON/models
  shmem:
    interface: shared-memory
    private: true

apps:
  freetoken-desktop:
    command: bin/freetoken-desktop-launch
    extensions: [gnome]
    environment:
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      CC: $SNAP/bin/freetoken-cc
      TRITON_LIBCUDA_PATH: /var/lib/snapd/lib/gl
      UV_PYTHON_PREFERENCE: only-managed
      PYTHONDONTWRITEBYTECODE: '1'
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
    plugs:
      - home
      - removable-media
      - network
      - network-bind
      - browser-support
      - shmem
      - server
      - models

parts:
  freetoken-desktop:
    plugin: dump
    source: https://github.com/FlashML-org/FreeToken-Web/releases/download/v$SNAPCRAFT_PROJECT_VERSION/freetoken-desktop-amd64.deb
    source-type: deb
    prime:
      - -usr/share/applications
      - -usr/share/icons

  runtime:
    plugin: nil
    stage-packages:
      - util-linux

  runtime-slices:
    plugin: nil
    stage-slices:
      - curl_bins
      - libgomp1_libs
      # Triton compiles its CUDA driver launcher at runtime.
      - gcc_gcc
      - libc6-dev_libs

  launcher:
    plugin: dump
    source: snap/local
    organize:
      '*': bin/
